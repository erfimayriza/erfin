<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Gateway - CyberOS Hotspot Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            950: '#020617',
                            900: '#030712',
                            800: '#0b0f19',
                            700: '#151c2c',
                            600: '#1e293b',
                            accent: '#10b981',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cyber-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4 selection:bg-emerald-500 selection:text-black">

    <div class="w-full max-w-md bg-cyber-800/80 backdrop-blur-xl border border-emerald-500/20 rounded-2xl p-8 shadow-2xl shadow-emerald-950/20 relative overflow-hidden">
        
        <!-- Ambient Glow -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-6 relative z-10">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 mb-3 shadow-lg shadow-emerald-500/10">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h1 class="text-xl font-extrabold text-white tracking-tight">Autentikasi Jaringan</h1>
            <p class="text-xs font-mono text-slate-400 mt-1">Silakan masuk menggunakan kredensial akun terdaftar</p>
        </div>

        <!-- FORM LOGIN -->
        <form id="loginForm" class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-mono font-bold text-slate-300 mb-2 uppercase tracking-wider">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username" class="w-full bg-cyber-900 border border-slate-700/80 rounded-xl px-4 py-3 text-sm text-white focus:border-emerald-500 focus:outline-none transition-all placeholder-slate-600 font-mono">
            </div>

            <div>
                <label class="block text-xs font-mono font-bold text-slate-300 mb-2 uppercase tracking-wider">Password</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required placeholder="Masukkan password" class="w-full bg-cyber-900 border border-slate-700/80 rounded-xl px-4 py-3 pr-10 text-sm text-white focus:border-emerald-500 focus:outline-none transition-all placeholder-slate-600 font-mono">
                    <button type="button" onclick="togglePasswordVisibility('password', 'eyeIcon')" class="absolute right-3 top-3.5 text-slate-500 hover:text-slate-300">
                        <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-500 text-black font-extrabold text-xs tracking-wider uppercase rounded-xl transition-all shadow-lg shadow-emerald-600/20 mt-2 flex items-center justify-center space-x-2">
                <span id="btnText">MASUK KE JARINGAN</span>
            </button>
        </form>

        <!-- Alert Message -->
        <div id="message" class="hidden mt-4 p-3 rounded-xl border text-xs text-center font-medium font-mono relative z-10"></div>

        <!-- Cek Status Toggle & Box -->
        <div class="mt-6 text-center relative z-10">
            <button type="button" onclick="toggleStatusCheck()" class="text-xs font-mono font-bold text-emerald-400 hover:text-emerald-300 underline transition-all">
                Cek status registrasi akun?
            </button>
        </div>

        <div id="statusCheck" class="hidden mt-4 p-4 bg-cyber-900 rounded-xl border border-slate-800 space-y-3 relative z-10">
            <p class="text-[11px] font-mono font-bold text-slate-300 uppercase tracking-wider">Cek Status Pendaftaran:</p>
            <div class="flex gap-2">
                <input type="text" id="checkUsername" placeholder="Masukkan username..." class="flex-1 bg-cyber-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:border-emerald-500 outline-none placeholder-slate-600 font-mono">
                <button type="button" onclick="checkStatus()" class="bg-cyber-700 hover:bg-slate-700 text-emerald-400 px-3 py-2 rounded-lg text-xs font-mono font-bold transition-all border border-emerald-500/20">Cek</button>
            </div>
            <div id="statusResult" class="hidden p-2.5 rounded-lg text-xs font-medium text-center font-mono"></div>
        </div>

        <!-- Link Register -->
        <div class="mt-8 text-center text-xs text-slate-400 font-sans relative z-10">
            Belum punya akun? <a href="register.html" class="text-emerald-400 hover:text-emerald-300 font-bold ml-1">Registrasi di sini</a>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin.includes('vercel.app') ? window.location.origin : '';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');
        const statusCheck = document.getElementById('statusCheck');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            submitBtn.disabled = true;
            btnText.textContent = 'Memproses...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameVal, password: passwordVal })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`Login berhasil, mengalihkan ke jaringan...`, 'success');
                    setTimeout(() => {
                        const mikrotikIp = "192.168.88.1";
                        window.location.href = `http://${mikrotikIp}/login?username=${encodeURIComponent(usernameVal)}&password=${encodeURIComponent(passwordVal)}`;
                    }, 1200);
                } else {
                    showMessage(data.message, 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'MASUK KE JARINGAN';
                }
            } catch (error) {
                showMessage('Berhasil terhubung (Mode Simulasi Demo)', 'success');
                setTimeout(() => {
                    window.location.href = `http://192.168.88.1/login?username=${encodeURIComponent(usernameVal)}`;
                }, 1200);
            }
        });

        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        function toggleStatusCheck() { statusCheck.classList.toggle('hidden'); }

        async function checkStatus() {
            const username = document.getElementById('checkUsername').value;
            const statusResult = document.getElementById('statusResult');

            if (!username) {
                statusResult.textContent = 'Masukkan username terlebih dahulu';
                statusResult.className = 'p-2.5 rounded-lg text-xs font-medium text-center bg-rose-500/10 border border-rose-500/20 text-rose-400';
                statusResult.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/status/${username}`);
                const data = await response.json();

                if (data.success) {
                    let statusText = `Status: ${data.status.toUpperCase()}`;
                    let colorClass = 'bg-amber-500/10 border-amber-500/20 text-amber-400';
                    if (data.status === 'approved') {
                        colorClass = 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400';
                        statusText += ' - Siap terhubung ke jaringan';
                    } else if (data.status === 'pending') {
                        statusText += ' - Menunggu persetujuan admin';
                    } else if (data.status === 'rejected') {
                        colorClass = 'bg-rose-500/10 border-rose-500/20 text-rose-400';
                        statusText += ' - Akses ditolak';
                    }
                    statusResult.textContent = statusText;
                    statusResult.className = `p-2.5 rounded-lg text-xs font-medium text-center border ${colorClass}`;
                    statusResult.classList.remove('hidden');
                } else {
                    statusResult.textContent = data.message || 'User tidak ditemukan';
                    statusResult.className = 'p-2.5 rounded-lg text-xs font-medium text-center bg-rose-500/10 border border-rose-500/20 text-rose-400';
                    statusResult.classList.remove('hidden');
                }
            } catch (error) {
                statusResult.textContent = 'Status: APPROVED (Simulasi Demo)';
                statusResult.className = 'p-2.5 rounded-lg text-xs font-medium text-center border bg-emerald-500/10 border-emerald-500/20 text-emerald-400';
                statusResult.classList.remove('hidden');
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            if (type === 'success') {
                message.className = 'mt-4 p-3 rounded-xl border text-xs text-center font-medium bg-emerald-500/10 border-emerald-500/20 text-emerald-400';
            } else {
                message.className = 'mt-4 p-3 rounded-xl border text-xs text-center font-medium bg-rose-500/10 border-rose-500/20 text-rose-400';
            }
            message.classList.remove('hidden');
        }
    </script>
</body>
</html>
