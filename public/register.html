<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Gateway - Registrasi Akun</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Plus Jakarta Sans & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            900: '#0a192f', /* Biru Tua Utama Background */
                            800: '#112240', /* Biru Tua Card & Modal */
                            700: '#1d3557', /* Border & Accent */
                            600: '#2563eb', /* Biru Utama Tombol */
                            500: '#3b82f6', /* Blue Glow */
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-navy-900 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-navy-800 border border-navy-700/80 rounded-2xl p-8 shadow-2xl relative overflow-hidden my-6">
        
        <!-- Header / Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-blue-500/10 text-blue-400 border border-blue-500/20 mb-3">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
            </div>
            <h1 class="text-xl font-heading font-extrabold text-white tracking-tight">Pendaftaran Akun Baru</h1>
            <p class="text-xs text-slate-400 mt-1">Lengkapi data diri untuk mendapatkan akses jaringan hotspot</p>
        </div>

        <!-- FORM REGISTRASI -->
        <form id="registerForm" class="space-y-4">
            <div>
                <label class="block text-xs font-heading font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Nama Lengkap</label>
                <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap" class="w-full bg-navy-900/90 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-navy-500 focus:outline-none transition-all placeholder-slate-600">
            </div>

            <div>
                <label class="block text-xs font-heading font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Email</label>
                <input type="email" id="email" name="email" required placeholder="Masukkan alamat email" class="w-full bg-navy-900/90 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-navy-500 focus:outline-none transition-all placeholder-slate-600">
            </div>

            <div>
                <label class="block text-xs font-heading font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Nomor Telepon</label>
                <input type="tel" id="phone" name="phone" required placeholder="Masukkan nomor telepon" class="w-full bg-navy-900/90 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-navy-500 focus:outline-none transition-all placeholder-slate-600">
            </div>

            <div>
                <label class="block text-xs font-heading font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Username</label>
                <input type="text" id="username" name="username" required placeholder="Buat username unik" class="w-full bg-navy-900/90 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-navy-500 focus:outline-none transition-all placeholder-slate-600">
            </div>

            <div>
                <label class="block text-xs font-heading font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Password</label>
                <input type="password" id="password" name="password" required placeholder="Buat kata sandi" class="w-full bg-navy-900/90 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-navy-500 focus:outline-none transition-all placeholder-slate-600">
            </div>

            <div>
                <label class="block text-xs font-heading font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Ulangi kata sandi" class="w-full bg-navy-900/90 border border-navy-700 rounded-xl px-4 py-2.5 text-sm text-white focus:border-navy-500 focus:outline-none transition-all placeholder-slate-600">
            </div>

            <button type="submit" class="w-full py-3.5 bg-navy-600 hover:bg-blue-600 text-white font-heading font-bold text-xs tracking-wider uppercase rounded-xl transition-all shadow-lg shadow-blue-600/20 mt-2" id="submitBtn">
                <span id="btnText">Daftar Sekarang</span>
            </button>
        </form>

        <!-- Message Alert -->
        <div id="message" class="hidden mt-4 p-3 rounded-xl border text-xs text-center font-medium"></div>

        <!-- Login Link -->
        <div class="mt-6 text-center text-xs text-slate-400 font-sans">
            Sudah punya akun? <a href="login.html" class="text-blue-400 hover:text-blue-300 font-heading font-bold ml-1">Login di sini</a>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const BACKEND_URL = window.location.origin.includes('vercel.app') 
            ? window.location.origin 
            : '';

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Kata sandi konfirmasi tidak cocok!', 'error');
                return;
            }

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                username: document.getElementById('username').value,
                password: password
            };

            submitBtn.disabled = true;
            btnText.innerHTML = 'Memproses Pendaftaran...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message + ' Mengalihkan ke halaman login...', 'success');
                    form.reset();

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message, 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Daftar Sekarang';
                }
            } catch (error) {
                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'Daftar Sekarang';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            if (type === 'success') {
                message.className = 'mt-4 p-3 rounded-xl border text-xs text-center font-medium bg-emerald-500/10 border-emerald-500/20 text-emerald-400';
            } else {
                message.className = 'mt-4 p-3 rounded-xl border text-xs text-center font-medium bg-red-500/10 border-red-500/20 text-red-400';
            }
            message.classList.remove('hidden');

            setTimeout(() => {
                message.classList.add('hidden');
            }, 5000);
        }
    </script>
</body>
</html>
