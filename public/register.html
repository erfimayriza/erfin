<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrasi Akun - TKJ F1 Telemetry Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }

        :root {
            --f1-red: #ff1801;
            --f1-red-glow: rgba(255, 24, 1, 0.6);
            --neon-cyan: #00f3ff;
            --neon-cyan-glow: rgba(0, 243, 255, 0.5);
            --bg-dark: #030508;
            --panel-bg: rgba(8, 12, 22, 0.85);
        }
        
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(255, 24, 1, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 90% 80%, rgba(0, 243, 255, 0.18) 0%, transparent 50%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            background-position: 0 0, 0 0, -1px -1px, -1px -1px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Scanline Animasi Layar Telemetri */
        body::before {
            content: " ";
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.6;
        }

        .glow-sphere-1 {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--f1-red-glow), transparent 70%);
            top: -50px;
            left: -50px;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .glow-sphere-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, var(--neon-cyan-glow), transparent 70%);
            bottom: -50px;
            right: -50px;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-top: 3px solid var(--neon-cyan);
            border-bottom: 2px solid var(--f1-red);
            border-radius: 20px;
            box-shadow: 
                0 0 40px rgba(0, 0, 0, 0.9),
                0 0 30px var(--neon-cyan-glow),
                inset 0 0 15px rgba(255, 255, 255, 0.05);
            padding: 35px 30px;
            max-width: 440px;
            width: 100%;
            position: relative;
            z-index: 1;
            overflow: hidden;
            margin: auto; /* Memastikan posisi card center sempurna */
        }

        .terminal-bar {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Membuat isi bar tersebar rapi secara simetris */
            margin-bottom: 22px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .terminal-dot-group {
            display: flex;
            gap: 6px;
        }

        .terminal-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot-red { background: #ff3b30; box-shadow: 0 0 8px #ff3b30; }
        .dot-yellow { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }
        .dot-green { background: #34c759; box-shadow: 0 0 8px #34c759; }

        .terminal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--neon-cyan);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            font-weight: 700;
            text-shadow: 0 0 8px var(--neon-cyan-glow);
        }

        .header { 
            text-align: center; 
            margin-bottom: 24px; 
        }
        
        .header h1 { 
            color: #ffffff; 
            font-family: 'Orbitron', sans-serif;
            font-size: 22px; 
            font-weight: 900; 
            margin-bottom: 4px; 
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-style: italic;
            text-shadow: 0 0 12px rgba(255,255,255,0.3);
        }
        
        .header p { 
            color: var(--neon-cyan); 
            font-size: 12px; 
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase; 
            letter-spacing: 0.2em; 
            text-shadow: 0 0 8px var(--neon-cyan-glow);
        }

        .form-group { 
            margin-bottom: 15px; 
        }
        
        .form-group label { 
            display: block; 
            margin-bottom: 5px; 
            color: #a0aec0; 
            font-weight: 700; 
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .form-group input {
            width: 100%; 
            padding: 11px 14px; 
            background: rgba(3, 6, 12, 0.9); 
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px; 
            font-size: 13px; 
            font-family: 'JetBrains Mono', monospace;
            color: #ffffff; 
            outline: none; 
            transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
        }
        
        .form-group input::placeholder { 
            color: #4a5568; 
        }
        
        .form-group input:focus { 
            border-color: var(--neon-cyan); 
            box-shadow: 0 0 15px var(--neon-cyan-glow), inset 0 0 5px var(--neon-cyan-glow); 
            background: rgba(2, 4, 8, 0.95);
        }

        .btn {
            width: 100%; 
            padding: 14px; 
            background: linear-gradient(135deg, #ff1801 0%, #ff5500 100%);
            color: #ffffff; 
            border: none; 
            border-radius: 10px; 
            font-size: 13px; 
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
            box-shadow: 0 0 20px var(--f1-red-glow);
        }
        
        .btn:hover { 
            box-shadow: 0 0 35px var(--f1-red), 0 0 10px var(--f1-red);
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ff331e 0%, #ff661a 100%);
        }
        
        .btn:active { 
            transform: translateY(1px); 
        }
        
        .btn:disabled { 
            background: #1e293b; 
            color: #64748b; 
            cursor: not-allowed; 
            box-shadow: none;
            transform: none;
        }

        .message { 
            padding: 12px 14px; 
            border-radius: 8px; 
            margin-top: 16px; 
            display: none; 
            font-size: 12px; 
            text-align: center; 
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            backdrop-filter: blur(10px);
        }
        
        .message.success { 
            background: rgba(0, 255, 102, 0.15); 
            color: #00ff66; 
            border: 1px solid rgba(0, 255, 102, 0.4); 
            box-shadow: 0 0 15px rgba(0,255,102,0.2); 
        }
        
        .message.error { 
            background: rgba(255, 24, 1, 0.15); 
            color: #ff5555; 
            border: 1px solid rgba(255, 24, 1, 0.4); 
            box-shadow: 0 0 15px rgba(255,24,1,0.2); 
        }

        .login-link { 
            text-align: center; 
            margin-top: 20px; 
            color: #94a3b8; 
            font-size: 13px; 
            font-weight: 600;
        }
        
        .login-link a { 
            color: var(--neon-cyan); 
            text-decoration: none; 
            font-weight: 700; 
            font-family: 'Orbitron', sans-serif;
            transition: all 0.3s;
            text-shadow: 0 0 5px var(--neon-cyan-glow);
        }
        
        .login-link a:hover { 
            color: var(--f1-red); 
            text-shadow: 0 0 8px var(--f1-red-glow);
            text-decoration: underline; 
        }

        .loading {
            display: inline-block; 
            width: 14px; 
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3); 
            border-radius: 50%; 
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite; 
            margin-right: 8px; 
            vertical-align: middle;
        }
        
        @keyframes spin { 
            to { transform: rotate(360deg); } 
        }
    </style>
</head>
<body>
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>

    <div class="container">
        <!-- Terminal Bar Header -->
        <div class="terminal-bar">
            <div class="terminal-dot-group">
                <div class="terminal-dot dot-red"></div>
                <div class="terminal-dot dot-yellow"></div>
                <div class="terminal-dot dot-green"></div>
            </div>
            <div class="terminal-title">eth0 / erfinmayriza</div>
        </div>

        <div class="header">
            <h1>Registrasi Akun</h1>
            <p></p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" name="name" required placeholder="Masukkan nama lengkap">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="Masukkan email">
            </div>

            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" name="phone" required placeholder="Masukkan nomor telepon">
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Konfirmasi password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Daftar Sekarang</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin.includes('vercel.app') 
            ? window.location.origin 
            : 'https://mikrotik-hostpot-login-done.vercel.app';

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Password tidak cocok!', 'error');
                return;
            }

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                username: document.getElementById('username').value,
                password: password
            };

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Memproses...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(data.message + ' Mengalihkan ke halaman login...', 'success');
                    form.reset();

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Daftar Sekarang';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';

            setTimeout(() => {
                message.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
