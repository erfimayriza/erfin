<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Login - Digital Navy Gateway</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            base: '#0B132B',   // Dark Navy Background
                            card: '#1C2541',   // Card / Panel Navy
                            accent: '#3A506B', // Border / Neutral Navy
                            light: '#5BC0BE',  // Cyber Teal Glow
                            cyan: '#00F0FF',   // Neon Digital Cyan
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0B132B;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(91, 192, 190, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(0, 240, 255, 0.05) 0%, transparent 50%);
            color: #F8FAFC;
            min-height: 100vh;
        }

        .navy-card {
            background: rgba(28, 37, 65, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(91, 192, 190, 0.18);
            box-shadow: 0 10px 30px -10px rgba(11, 19, 43, 0.5);
        }

        .digital-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-online {
            background-color: #10B981;
            box-shadow: 0 0 10px #10B981;
        }
    </style>
</head>
<body class="font-sans antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-md navy-card rounded-2xl p-8 shadow-2xl relative overflow-hidden border-t-2 border-t-navy-light">
        
        <!-- Top Indicator -->
        <div class="flex items-center justify-between mb-6 border-b border-navy-accent/30 pb-3">
            <div class="flex items-center space-x-2">
                <span class="digital-dot dot-online"></span>
                <span class="font-mono text-xs text-navy-light uppercase tracking-wider font-semibold">Hotspot Gateway</span>
            </div>
            <span class="font-mono text-[10px] text-gray-400">RouterOS v7</span>
        </div>

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-white tracking-tight">Selamat Datang</h1>
            <p class="text-xs text-gray-400 mt-1 font-mono">Silakan masuk menggunakan akun terdaftar</p>
        </div>

        <!-- MIKROTIK NATIVE LOGIN FORM -->
        <form id="loginForm" name="login" action="$(link-login-only)" method="post" class="space-y-4">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div>
                <label class="block text-xs font-mono font-medium text-gray-300 mb-1.5 uppercase tracking-wider">Username</label>
                <input type="text" id="username" name="username" value="" required placeholder="Masukkan username" class="w-full bg-navy-base border border-navy-accent/50 rounded-xl px-4 py-3 text-sm font-mono text-white focus:border-navy-cyan focus:outline-none transition-all shadow-inner placeholder-gray-600">
            </div>

            <div>
                <label class="block text-xs font-mono font-medium text-gray-300 mb-1.5 uppercase tracking-wider">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password" class="w-full bg-navy-base border border-navy-accent/50 rounded-xl px-4 py-3 text-sm font-mono text-white focus:border-navy-cyan focus:outline-none transition-all shadow-inner placeholder-gray-600">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-navy-light to-navy-cyan hover:opacity-90 text-navy-base font-semibold text-xs tracking-widest uppercase rounded-xl transition-all shadow-[0_0_20px_rgba(91,192,190,0.3)] mt-2">
                <span id="btnText">MASUK JARINGAN</span>
            </button>
        </form>

        <!-- Message Alert -->
        <div id="message" class="hidden mt-4 p-3 rounded-xl border text-xs font-mono text-center"></div>

        <!-- Status Check Toggle & Box -->
        <div class="mt-6 text-center">
            <button type="button" onclick="toggleStatusCheck()" class="text-xs font-mono text-navy-light hover:text-navy-cyan underline transition-all">
                Cek status registrasi akun?
            </button>
        </div>

        <div id="statusCheck" class="hidden mt-4 p-4 bg-navy-base/80 rounded-xl border border-navy-accent/40 space-y-3">
            <p class="text-[11px] font-mono text-gray-300 uppercase">Cek Status Pendaftaran:</p>
            <div class="flex gap-2">
                <input type="text" id="checkUsername" placeholder="Username..." class="flex-1 bg-navy-card border border-navy-accent/60 rounded-lg px-3 py-2 text-xs font-mono text-white focus:border-navy-cyan outline-none">
                <button type="button" onclick="checkStatus()" class="bg-navy-light/10 hover:bg-navy-light/20 text-navy-light border border-navy-light/30 px-3 py-2 rounded-lg text-xs font-mono font-semibold transition-all">Cek</button>
            </div>
            <div id="statusResult" class="hidden p-2.5 rounded-lg text-xs font-mono text-center"></div>
        </div>

        <!-- Register Link -->
        <div class="mt-8 text-center text-xs text-gray-400 font-mono">
            Belum punya akun? <a href="register.html" class="text-navy-light hover:text-navy-cyan font-semibold ml-1">Registrasi di sini</a>
        </div>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        const BACKEND_URL = window.location.origin.includes('vercel.app') 
            ? window.location.origin 
            : '';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');
        const statusCheck = document.getElementById('statusCheck');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            submitBtn.disabled = true;
            btnText.innerHTML = 'Memproses...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameVal, password: passwordVal })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`Login berhasil, selamat datang ${data.user.name}!`, 'success');
                    setTimeout(() => {
                        HTMLFormElement.prototype.submit.call(form);
                    }, 1200);
                } else {
                    showMessage(data.message, 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'MASUK JARINGAN';
                }
            } catch (error) {
                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'MASUK JARINGAN';
            }
        });

        function toggleStatusCheck() {
            statusCheck.classList.toggle('hidden');
        }

        async function checkStatus() {
            const username = document.getElementById('checkUsername').value;
            const statusResult = document.getElementById('statusResult');

            if (!username) {
                statusResult.textContent = 'Masukkan username terlebih dahulu';
                statusResult.className = 'p-2.5 rounded-lg text-xs font-mono text-center bg-red-500/10 border border-red-500/30 text-red-400';
                statusResult.classList.remove('hidden');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/status/${username}`);
                const data = await response.json();

                if (data.success) {
                    let statusText = `Status: ${data.status.toUpperCase()}`;
                    let colorClass = 'bg-amber-500/10 border-amber-500/30 text-amber-400';
                    
                    if (data.status === 'approved') {
                        colorClass = 'bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
                        statusText += ' - Siap terhubung ke jaringan';
                    } else if (data.status === 'pending') {
                        statusText += ' - Menunggu persetujuan admin';
                    } else if (data.status === 'rejected') {
                        colorClass = 'bg-red-500/10 border-red-500/30 text-red-400';
                        statusText += ' - Akses ditolak';
                    }

                    statusResult.textContent = statusText;
                    statusResult.className = `p-2.5 rounded-lg text-xs font-mono text-center border ${colorClass}`;
                    statusResult.classList.remove('hidden');
                } else {
                    statusResult.textContent = data.message || 'User tidak ditemukan';
                    statusResult.className = 'p-2.5 rounded-lg text-xs font-mono text-center bg-red-500/10 border border-red-500/30 text-red-400';
                    statusResult.classList.remove('hidden');
                }
            } catch (error) {
                statusResult.textContent = 'Gagal mengecek status server';
                statusResult.className = 'p-2.5 rounded-lg text-xs font-mono text-center bg-red-500/10 border border-red-500/30 text-red-400';
                statusResult.classList.remove('hidden');
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            if (type === 'success') {
                message.className = 'mt-4 p-3 rounded-xl border text-xs font-mono text-center bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
            } else {
                message.className = 'mt-4 p-3 rounded-xl border text-xs font-mono text-center bg-red-500/10 border-red-500/30 text-red-400';
            }
            message.classList.remove('hidden');
        }
    </script>
</body>
</html>
